{% extends "master.html" %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="text-center mb-4">Login</h2>
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email:</label>
                                <input type="email" name="email" id="email" class="form-control bg-secondary-subtle" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha:</label>
                                <div class="input-group">
                                    <input type="password" name="password" id="password" class="form-control bg-secondary-subtle" maxlength="100" required>
                                    <button type="button" class="btn btn-secondary rounded-bottom" id="btn-icon"><i class="bi bi-eye-fill" id="icon"></i></button>
                                </div>
                            </div>
                            <div class="mb-2 text-start">
                                <small>Ou <a href="/register">cadastre-se agora</a></small>
                            </div>
                            <button type="submit" class="btn btn-primary rounded w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/assets/js/auth/app-auth.js"></script>
    <script src="/assets/js/auth/form.js"></script>
{% endblock %}
