{% extends "master.html" %}

{% block content %}
    <main class="container" style="margin-top: 80px; margin-bottom: 60px;">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Saída de Produto</h3>

                        <form action="/outflow" method="post" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="product_id" class="form-label">Produto</label>
                                <select id="product_id" name="product_id" class="form-select" required>
                                    <option value="" disabled selected>Selecione um produto</option>
                                    {% for product in products %}
                                        <option value="{{ product.id }}">{{ product.nome }} (Estoque: {{ product.quantidade }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="quantidade" class="form-label">Quantidade retirada</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="quantidade" name="quantidade" required>
                            </div>

                            <div class="mb-3">
                                <label for="observacao" class="form-label">Observação</label>
                                <textarea id="observacao" name="observacao" class="form-control" rows="3" placeholder="Ex.: Venda, transferência, consumo interno"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger">Registrar saída</button>
                                <a href="/dashboard" class="btn btn-outline-secondary">Voltar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="/assets/js/product/outflow-form.js"></script>
{% endblock %}
